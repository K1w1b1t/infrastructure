name: Terraform Security

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Scan Terraform with Checkov
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/tf:ro" --workdir /tf
          bridgecrew/checkov:3.4.5 --directory /tf --framework terraform --output cli

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Scan infrastructure configuration with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: '1'
          format: table
