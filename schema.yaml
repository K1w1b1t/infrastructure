schemaVersion: "1.1.0"
locale: "pt-BR"

variableGroups:
  - title: "PostHog"
    variables:
      - posthog_api_key
      - posthog_host
      - posthog_project_id
      - posthog_app_urls
      - posthog_discord_webhook_url

variables:
  posthog_api_key:
    type: string
    title: "PostHog Personal API Key"
    description: "Chave pessoal usada pelo Terraform para administrar recursos no PostHog. Nao use a Project API Key (phc_...)."
    required: true
    sensitive: true

  posthog_project_id:
    type: string
    title: "PostHog Project ID"
    description: "ID numerico do projeto PostHog existente, obtido em Project settings."
    required: true

  posthog_app_urls:
    type: string
    title: "Dominios autorizados PostHog"
    description: "Lista JSON de URLs HTTPS exatas usadas pelos dois apps em staging e producao; sem curingas."
    required: true

  posthog_discord_webhook_url:
    type: string
    title: "PostHog Discord webhook"
    description: "Incoming Webhook do Discord para alertas de erro de producao."
    required: true
    sensitive: true

  posthog_host:
    type: enum
    title: "PostHog region"
    description: "Selecione a regiao onde a conta PostHog Cloud foi criada."
    required: false
    default: "https://us.posthog.com"
    enum:
      - "https://us.posthog.com"
      - "https://eu.posthog.com"
